<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collabo Desktop</title>
  <style>
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin-bottom: 24px; }
    code { background: #27272a; padding: 2px 6px; border-radius: 6px; color: #60a5fa; font-size: 12px; }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
      margin-top: 8px;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #27272a;
      color: #d4d4d8;
    }
    .btn-secondary:hover { background: #3f3f46; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Collabo Desktop</h1>
    <p id="status-text">Connecting to Collabo server...</p>
    <button class="btn" id="connect-btn" onclick="retryConnect()">Connect to Dashboard</button>
    <button class="btn btn-secondary" onclick="window.location.reload()">Reload App</button>
  </div>

  <script>
    let targetUrl = 'https://collabo-backend.eastasia.cloudapp.azure.com/desktop-host';

    async function init() {
      if (window.electronAPI && window.electronAPI.getServerUrl) {
        try {
          const sUrl = await window.electronAPI.getServerUrl();
          if (sUrl) {
            targetUrl = sUrl.replace(/\/+$/, '') + '/desktop-host';
          }
        } catch (e) {}
      }
      document.getElementById('status-text').innerHTML = 'Configured Server: <code>' + targetUrl + '</code>';
      // Attempt redirect
      window.location.href = targetUrl;
    }

    function retryConnect() {
      window.location.href = targetUrl;
    }

    init();
  </script>
</body>
</html>
