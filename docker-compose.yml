version: '3.8'

# ===================================================
# Collabo — Docker Compose Stack with Automatic Caddy SSL
# ===================================================

services:
  collabo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    network_mode: "host" # Host networking ensures direct WebRTC UDP binding to the announced public IP
    environment:
      - PORT=3000
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      - MEDIASOUP_MIN_PORT=40000
      - MEDIASOUP_MAX_PORT=49999
      - NODE_ENV=production

  caddy:
    image: caddy:2-alpine
    restart: always
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}

volumes:
  caddy_data:
  caddy_config:
